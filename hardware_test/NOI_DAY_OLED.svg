<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720">
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #1f2933; }
    .title { font-size: 24px; font-weight: 700; }
    .sub   { font-size: 14px; fill: #52606d; }
    .mt    { font-size: 15px; font-weight: 700; text-anchor: middle; }
    .ms    { font-size: 12px; fill: #52606d; text-anchor: middle; }
    .wt    { font-size: 14px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .pinw  { font-size: 14px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
    .pin   { font-size: 14px; font-weight: 700; fill: #334e68; }
    .row   { font-size: 15px; }
    .warn  { font-size: 13.5px; font-weight: 700; fill: #c62828; }
    .w     { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .red { stroke: #d32f2f; } .blk { stroke: #212121; } .yel { stroke: #f9a825; } .blu { stroke: #1e88e5; }
    .badge circle { fill: #ffffff; stroke: #1f2933; stroke-width: 2; }
    .badge text { font-size: 13px; font-weight: 800; text-anchor: middle; }
  </style>

  <rect width="1240" height="720" fill="#ffffff"/>
  <text x="40" y="46" class="title">NỐI MÀN HÌNH OLED 0,96 inch (I2C, 4 chân) VÀO ESP32-S3 CAM</text>
  <text x="40" y="72" class="sub">Chỉ 4 dây, không cần điện trở. OLED dùng chung đường I2C (GPIO21 / GPIO47) mà firmware đã khai báo sẵn.</text>

  <!-- ESP32 -->
  <rect x="60" y="120" width="300" height="400" rx="14" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="200" y="440" class="mt" style="font-size:18px">ESP32-S3 CAM</text>
  <text x="200" y="462" class="ms">AM312, DFPlayer, phun sương</text>
  <text x="200" y="478" class="ms">giữ nguyên như sơ đồ cũ</text>
  <text x="345" y="185" class="pin" text-anchor="end">GPIO21 (SDA)</text>
  <text x="345" y="245" class="pin" text-anchor="end">GPIO47 (SCL)</text>
  <text x="345" y="305" class="pin" text-anchor="end">3V3</text>
  <text x="345" y="365" class="pin" text-anchor="end">GND</text>
  <circle cx="360" cy="180" r="7" fill="#ffca28" stroke="#b7791f" stroke-width="1.5"/>
  <circle cx="360" cy="240" r="7" fill="#ffca28" stroke="#b7791f" stroke-width="1.5"/>
  <circle cx="360" cy="300" r="7" fill="#ffca28" stroke="#b7791f" stroke-width="1.5"/>
  <circle cx="360" cy="360" r="7" fill="#ffca28" stroke="#b7791f" stroke-width="1.5"/>

  <!-- OLED -->
  <rect x="820" y="210" width="340" height="300" rx="12" fill="#0d47a1" stroke="#0b3478" stroke-width="2"/>
  <rect x="855" y="300" width="270" height="180" rx="4" fill="#111827"/>
  <text x="990" y="375" class="mt" style="fill:#7dd3fc;font-size:18px">OLED 0,96"</text>
  <text x="990" y="400" class="ms" style="fill:#93c5fd">128 × 64 · SSD1306</text>
  <text x="990" y="420" class="ms" style="fill:#93c5fd">địa chỉ I2C 0x3C</text>
  <circle cx="880" cy="240" r="9" fill="#ffca28"/><text x="880" y="277" class="pinw">GND</text>
  <circle cx="950" cy="240" r="9" fill="#ffca28"/><text x="950" y="277" class="pinw">VCC</text>
  <circle cx="1020" cy="240" r="9" fill="#ffca28"/><text x="1020" y="277" class="pinw">SCL</text>
  <circle cx="1090" cy="240" r="9" fill="#ffca28"/><text x="1090" y="277" class="pinw">SDA</text>
  <text x="990" y="540" class="ms">(4 chân cắm nằm ở mép trên của màn hình)</text>

  <!-- dây: không dây nào cắt nhau -->
  <path d="M367 180H560V110H1090V231" class="w blu"/>
  <path d="M367 240H600V135H1020V231" class="w yel"/>
  <path d="M367 300H640V160H950V231" class="w red"/>
  <path d="M367 360H680V185H880V231" class="w blk"/>

  <text x="460" y="170" class="pin" style="fill:#1e88e5" text-anchor="middle">dây XANH</text>
  <text x="480" y="230" class="pin" style="fill:#b7791f" text-anchor="middle">dây VÀNG</text>
  <text x="500" y="290" class="pin" style="fill:#d32f2f" text-anchor="middle">dây ĐỎ</text>
  <text x="520" y="350" class="pin" text-anchor="middle">dây ĐEN</text>

  <g class="badge">
    <circle cx="400" cy="180" r="14"/><text x="400" y="185">4</text>
    <circle cx="400" cy="240" r="14"/><text x="400" y="245">3</text>
    <circle cx="400" cy="300" r="14"/><text x="400" y="305">1</text>
    <circle cx="400" cy="360" r="14"/><text x="400" y="365">2</text>
  </g>

  <line x1="40" y1="650" x2="1200" y2="650" stroke="#d9e2ec" stroke-width="1.5"/>
  <g class="row">
    <text x="40" y="676"><tspan font-weight="800">1.</tspan> 3V3 ESP32 → VCC OLED</text>
    <text x="330" y="676"><tspan font-weight="800">2.</tspan> GND ESP32 → GND OLED</text>
    <text x="620" y="676"><tspan font-weight="800">3.</tspan> GPIO47 → SCL OLED</text>
    <text x="900" y="676"><tspan font-weight="800">4.</tspan> GPIO21 → SDA OLED</text>
  </g>
  <text x="40" y="704" class="warn">⚠ Đọc chữ in trên OLED: có loại xếp "VCC GND SCL SDA" (đảo 2 chân đầu). Nối theo TÊN CHÂN, không theo vị trí. Cấp 3V3, không nối nhầm VCC–GND.</text>
</svg>
