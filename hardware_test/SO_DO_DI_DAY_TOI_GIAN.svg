<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1070" viewBox="0 0 1320 1070">
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #1f2933; }
    .title { font-size: 24px; font-weight: 700; }
    .sub   { font-size: 13px; fill: #52606d; }
    .sec   { font-size: 15px; font-weight: 700; fill: #1565c0; }
    .mt    { font-size: 14px; font-weight: 700; text-anchor: middle; }
    .ms    { font-size: 11px; fill: #52606d; text-anchor: middle; }
    .pin   { font-size: 11.5px; font-weight: 700; fill: #334e68; }
    .note  { font-size: 12.5px; fill: #3e4c59; }
    .warn  { font-size: 12px; font-weight: 700; fill: #c62828; }
    .small { font-size: 11px; font-weight: 600; fill: #3e4c59; }
    .busl  { font-size: 13px; font-weight: 700; fill: #ef6c00; }
    .box   { fill: #f5f7fa; stroke: #486581; stroke-width: 1.5; }
    .w     { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .v5 { stroke: #ef6c00; } .v33 { stroke: #8e24aa; } .gnd { stroke: #263238; }
    .uart { stroke: #00838f; } .pir { stroke: #b7791f; } .ctl { stroke: #c2185b; } .ld { stroke: #546e7a; } .spk { stroke: #757575; }
    .res { fill: #ffffff; stroke: #263238; stroke-width: 1.8; }
    .plate { stroke: #263238; stroke-width: 3; }
  </style>
  <defs>
    <g id="gnd" class="w gnd">
      <path d="M0 0v10M-12 10h24M-8 15h16M-4 20h8"/>
    </g>
  </defs>

  <rect width="1320" height="1070" fill="#ffffff"/>
  <text x="40" y="46" class="title">SƠ ĐỒ ĐI DÂY BẢN TỐI GIẢN – HỆ THỐNG ĐUỔI SÓC THÔNG MINH</text>
  <text x="40" y="70" class="sub">ESP32-S3 CAM · PIR AM312 · DFPlayer Mini + loa 4Ω 3W · phun sương 5V qua MOSFET IRLZ44N · nguồn adapter 5V 3A · chân giống hệt config.h</text>

  <!-- ================= NGUỒN ================= -->
  <rect x="40" y="110" width="170" height="70" rx="10" class="box"/>
  <text x="125" y="140" class="mt">ADAPTER 5V 3A</text>
  <text x="125" y="160" class="ms">(tối thiểu 2A)</text>
  <text x="216" y="125" class="small">+</text>
  <text x="216" y="161" class="small">−</text>
  <path d="M210 130H250" class="w v5"/>
  <path d="M210 165H225V205" class="w gnd"/>
  <use href="#gnd" x="225" y="205"/>

  <rect x="250" y="110" width="160" height="70" rx="10" class="box"/>
  <text x="330" y="140" class="mt">JACK DC + CÔNG TẮC</text>
  <text x="330" y="160" class="ms">bật/tắt toàn hệ thống</text>
  <path d="M410 130H440V210" class="w v5"/>

  <!-- BUS +5V -->
  <path d="M440 210H1270" class="w v5" style="stroke-width:4.5"/>
  <text x="640" y="200" class="busl">BUS +5V (dây ≥ 0,5mm²)</text>
  <circle cx="480" cy="210" r="4.5" fill="#ef6c00"/>
  <circle cx="560" cy="210" r="4.5" fill="#ef6c00"/>
  <circle cx="960" cy="210" r="4.5" fill="#ef6c00"/>

  <!-- C1 -->
  <path d="M480 210V240" class="w v5"/>
  <path d="M466 240H494M466 248H494" class="plate"/>
  <path d="M480 248V258" class="w gnd"/>
  <use href="#gnd" x="480" y="258"/>
  <text x="500" y="250" class="small">C1 1000µF</text>

  <!-- ================= ESP32-S3 ================= -->
  <path d="M560 210V300" class="w v5"/>
  <rect x="480" y="300" width="300" height="400" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="560" y="320" class="pin" text-anchor="middle">5V</text>
  <text x="630" y="690" class="pin" text-anchor="middle">GND</text>
  <text x="490" y="474" class="pin">3V3</text>
  <text x="490" y="509" class="pin">GPIO14</text>
  <text x="770" y="404" class="pin" text-anchor="end">GPIO42 (TX)</text>
  <text x="770" y="444" class="pin" text-anchor="end">GPIO41 (RX)</text>
  <text x="770" y="624" class="pin" text-anchor="end">GPIO48</text>

  <rect x="590" y="370" width="80" height="60" rx="8" fill="#263238"/>
  <circle cx="630" cy="400" r="19" fill="#455a64"/>
  <circle cx="630" cy="400" r="9" fill="#81d4fa"/>
  <text x="630" y="450" class="ms">camera có sẵn</text>
  <text x="630" y="515" class="mt" style="font-size:16px">Freenove</text>
  <text x="630" y="537" class="mt" style="font-size:16px">ESP32-S3-WROOM CAM</text>
  <text x="630" y="557" class="ms">(N8R8 – OPI PSRAM)</text>
  <rect x="600" y="585" width="60" height="16" rx="3" fill="#90a4ae"/>
  <text x="630" y="620" class="ms">khe thẻ nhớ có sẵn</text>
  <text x="630" y="660" class="ms">USB: chỉ cắm khi đã tắt adapter</text>

  <path d="M630 700V740" class="w gnd"/>
  <use href="#gnd" x="630" y="740"/>

  <!-- ================= PIR AM312 ================= -->
  <text x="195" y="420" class="mt">CẢM BIẾN PIR AM312</text>
  <rect x="110" y="430" width="170" height="140" rx="10" fill="#fff8e1" stroke="#b7791f" stroke-width="2"/>
  <circle cx="160" cy="500" r="32" fill="#fafafa" stroke="#9e9e9e" stroke-width="1.5"/>
  <circle cx="160" cy="500" r="20" fill="none" stroke="#e0e0e0" stroke-width="1.2"/>
  <text x="270" y="474" class="pin" text-anchor="end">VCC</text>
  <text x="270" y="509" class="pin" text-anchor="end">OUT</text>
  <text x="270" y="544" class="pin" text-anchor="end">GND</text>
  <text x="195" y="590" class="ms">chân giữa = OUT · xem chữ in trên mạch</text>

  <path d="M280 470H480" class="w v33"/>
  <text x="380" y="462" class="small" text-anchor="middle">3,3V</text>
  <path d="M280 505H480" class="w pir"/>
  <path d="M280 540H330V560" class="w gnd"/>
  <use href="#gnd" x="330" y="560"/>

  <text x="110" y="618" class="small">• Hàn tụ 100nF giữa VCC–GND, sát chân cảm biến</text>
  <text x="110" y="636" class="warn">• Đặt cách anten ESP32 ≥ 10cm (chống nhiễu WiFi)</text>
  <text x="110" y="654" class="small">• Chờ 30–60 giây sau khi cấp điện</text>

  <!-- ================= DFPlayer ================= -->
  <path d="M960 210V300" class="w v5"/>
  <rect x="900" y="300" width="240" height="200" rx="12" fill="#e0f7fa" stroke="#00838f" stroke-width="2"/>
  <text x="960" y="320" class="pin" text-anchor="middle">VCC</text>
  <text x="910" y="404" class="pin">RX</text>
  <text x="910" y="444" class="pin">TX</text>
  <text x="910" y="484" class="pin">GND</text>
  <text x="1130" y="384" class="pin" text-anchor="end">SPK_1</text>
  <text x="1130" y="424" class="pin" text-anchor="end">SPK_2</text>
  <text x="1030" y="352" class="mt">DFPlayer Mini</text>
  <text x="1030" y="370" class="ms">khuếch đại 3W có sẵn</text>
  <text x="1030" y="464" class="ms">microSD FAT32:</text>
  <text x="1030" y="478" class="ms">0001.mp3, 0002.mp3…</text>

  <!-- C2 -->
  <path d="M960 250H1010V258" class="w v5"/>
  <circle cx="960" cy="250" r="4" fill="#ef6c00"/>
  <path d="M996 258H1024M996 266H1024" class="plate"/>
  <path d="M1010 266V274" class="w gnd"/>
  <use href="#gnd" x="1010" y="274"/>
  <text x="1032" y="266" class="small">C2 470µF + 100nF (sát VCC)</text>

  <!-- UART -->
  <path d="M780 400H815" class="w uart"/>
  <rect x="815" y="391" width="50" height="18" rx="3" class="res"/>
  <text x="840" y="385" class="small" text-anchor="middle">1kΩ</text>
  <path d="M865 400H900" class="w uart"/>
  <path d="M900 440H780" class="w uart"/>

  <path d="M900 480H870V500" class="w gnd"/>
  <use href="#gnd" x="870" y="500"/>

  <!-- Loa -->
  <path d="M1140 380H1190M1140 420H1190" class="w spk"/>
  <rect x="1190" y="370" width="18" height="60" fill="#cfd8dc" stroke="#455a64" stroke-width="1.8"/>
  <path d="M1208 370L1240 345V455L1208 430Z" fill="#eceff1" stroke="#455a64" stroke-width="1.8"/>
  <text x="1205" y="478" class="mt">LOA 4Ω 3W</text>
  <text x="1205" y="496" class="warn" text-anchor="middle">SPK không nối GND</text>

  <!-- ================= PHUN SƯƠNG + MOSFET ================= -->
  <path d="M1270 210V600H1100" class="w v5"/>
  <rect x="900" y="580" width="200" height="90" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="990" y="618" class="mt">PHUN SƯƠNG 5V</text>
  <text x="990" y="638" class="ms">module siêu âm</text>
  <text x="1090" y="604" class="pin" text-anchor="end">+</text>
  <text x="1090" y="654" class="pin" text-anchor="end">−</text>

  <path d="M1100 650H1180V730" class="w ld"/>

  <!-- Diode chống dòng ngược: vạch (catot) về phía +5V -->
  <circle cx="1230" cy="600" r="4" fill="#ef6c00"/>
  <path d="M1230 600V640" class="w v5"/>
  <path d="M1218 640H1242" class="plate"/>
  <path d="M1218 662H1242L1230 642Z" fill="#263238"/>
  <path d="M1230 662V700H1180" class="w ld"/>
  <circle cx="1180" cy="700" r="4" fill="#546e7a"/>
  <text x="1246" y="648" class="small">D1</text>
  <text x="1246" y="663" class="small">1N5819</text>

  <rect x="1130" y="730" width="100" height="90" rx="10" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="1186" y="746" class="pin">D</text>
  <text x="1137" y="779" class="pin">G</text>
  <text x="1186" y="815" class="pin">S</text>
  <text x="1186" y="776" class="mt">IRLZ44N</text>
  <text x="1186" y="792" class="ms">MOSFET</text>
  <path d="M1180 820V840" class="w gnd"/>
  <use href="#gnd" x="1180" y="840"/>

  <!-- Gate -->
  <path d="M780 620H820V775H880" class="w ctl"/>
  <rect x="880" y="766" width="50" height="18" rx="3" class="res"/>
  <text x="905" y="760" class="small" text-anchor="middle">220Ω</text>
  <path d="M930 775H1130" class="w ctl"/>
  <circle cx="1000" cy="775" r="4" fill="#c2185b"/>
  <path d="M1000 775V790" class="w ctl"/>
  <rect x="991" y="790" width="18" height="46" rx="3" class="res"/>
  <path d="M1000 836V848" class="w gnd"/>
  <use href="#gnd" x="1000" y="848"/>
  <text x="1016" y="818" class="small">10kΩ</text>

  <!-- ================= GHI CHÚ ================= -->
  <line x1="40" y1="890" x2="1280" y2="890" stroke="#d9e2ec" stroke-width="1.5"/>
  <text x="40" y="918" class="sec">GHI CHÚ</text>
  <text x="40" y="944" class="note">★ Mọi ký hiệu GND (3 vạch ngang) nối chung về một điểm: cực − của adapter.</text>
  <text x="40" y="966" class="warn">⚠ Không cắm USB máy tính khi adapter 5V đang bật – tắt công tắc trước khi nạp code (giữ dây GND chung).</text>
  <text x="40" y="988" class="note">• Loa và phun sương lấy điện từ BUS +5V, không lấy từ chân 5V của board ESP32.</text>
  <text x="40" y="1010" class="note">• IRLZ44N: mặt có chữ hướng về mình, chân trái → phải = G · D · S. Không dùng IRF520 (không mở đủ ở 3,3V).</text>
  <text x="40" y="1032" class="note">• Phun sương phải bấm nút mới chạy: xem mục 3.3 trong SO_DO_DI_DAY_TOI_GIAN.md.</text>
  <text x="40" y="1054" class="note">• Nếu ESP32 reset khi loa kêu: dùng adapter 3A, thêm tụ, giảm âm lượng xuống khoảng 20–24.</text>

  <!-- Chú giải màu dây -->
  <text x="1010" y="918" class="sec">MÀU DÂY</text>
  <g class="small">
    <path d="M1010 940h34" class="w v5"/><text x="1052" y="944">+5V</text>
    <path d="M1140 940h34" class="w v33"/><text x="1182" y="944">3,3V</text>
    <path d="M1010 962h34" class="w gnd"/><text x="1052" y="966">GND</text>
    <path d="M1140 962h34" class="w pir"/><text x="1182" y="966">Tín hiệu PIR</text>
    <path d="M1010 984h34" class="w uart"/><text x="1052" y="988">UART</text>
    <path d="M1140 984h34" class="w ctl"/><text x="1182" y="988">Điều khiển</text>
    <path d="M1010 1006h34" class="w ld"/><text x="1052" y="1010">Tải (−)</text>
    <path d="M1140 1006h34" class="w spk"/><text x="1182" y="1010">Loa</text>
  </g>
</svg>
