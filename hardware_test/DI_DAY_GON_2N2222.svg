<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820">
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #1f2933; }
    .title { font-size: 24px; font-weight: 700; }
    .sub   { font-size: 14px; fill: #52606d; }
    .mt    { font-size: 15px; font-weight: 700; text-anchor: middle; }
    .ms    { font-size: 12px; fill: #52606d; text-anchor: middle; }
    .wt    { font-size: 14px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .pinw  { font-size: 13px; font-weight: 700; fill: #ffe082; }
    .pin   { font-size: 13px; font-weight: 700; fill: #334e68; }
    .row   { font-size: 14px; }
    .warn  { font-size: 13.5px; font-weight: 700; fill: #c62828; }
    .w     { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .red { stroke: #d32f2f; } .blk { stroke: #212121; } .ctl { stroke: #c2185b; }
    .cable { fill: none; stroke: #9e9e9e; stroke-width: 10; stroke-linecap: round; }
    .res   { fill: #fff3e0; stroke: #6d4c41; stroke-width: 2; }
    .badge circle { fill: #ffffff; stroke: #1f2933; stroke-width: 2; }
    .badge text { font-size: 13px; font-weight: 800; text-anchor: middle; }
  </style>

  <rect width="1240" height="820" fill="#ffffff"/>
  <text x="40" y="46" class="title">CÁCH ĐI DÂY GỌN – dùng transistor 2N2222 bật/tắt phun sương</text>
  <text x="40" y="72" class="sub">Pin → mạch sạc → cáp USB cắm thẳng vào ESP32. Chỉ cần thêm 1 transistor 2N2222 + điện trở 150Ω + điện trở 10kΩ.</text>

  <!-- PIN -->
  <rect x="75" y="135" width="40" height="15" rx="3" fill="#90a4ae"/>
  <rect x="40" y="150" width="110" height="200" rx="16" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="95" y="178" class="mt" style="fill:#d32f2f;font-size:22px">+</text>
  <text x="95" y="242" class="mt">PIN</text>
  <text x="95" y="262" class="mt">3,7V</text>
  <text x="95" y="282" class="ms">10000mAh</text>
  <text x="95" y="338" class="mt" style="font-size:24px">−</text>
  <path d="M95 135V115H215V190H252" class="w red"/>
  <path d="M95 350V375H215V290H252" class="w blk"/>

  <!-- MẠCH SẠC -->
  <rect x="250" y="150" width="210" height="180" rx="10" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
  <text x="355" y="235" class="wt">MẠCH SẠC</text>
  <text x="355" y="255" class="wt">5V 2A</text>
  <circle cx="262" cy="190" r="7" fill="#ffca28"/><text x="276" y="195" class="pinw">B+</text>
  <circle cx="262" cy="290" r="7" fill="#ffca28"/><text x="276" y="295" class="pinw">B−</text>
  <rect x="450" y="212" width="34" height="56" rx="4" fill="#cfd8dc" stroke="#607d8b" stroke-width="2"/>
  <rect x="458" y="222" width="18" height="36" fill="#37474f"/>
  <rect x="330" y="322" width="50" height="16" rx="4" fill="#9e9e9e"/>
  <text x="355" y="360" class="ms">↑ cắm sạc điện thoại để sạc pin</text>

  <!-- CÁP USB → ESP32 -->
  <path d="M484 240H596" class="cable"/>
  <rect x="596" y="230" width="22" height="20" rx="6" fill="#455a64"/>
  <text x="540" y="206" class="pin" text-anchor="middle">cáp USB → Type-C</text>
  <text x="540" y="270" class="ms">cắm, không cần hàn</text>

  <!-- ESP32 -->
  <rect x="618" y="140" width="220" height="300" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="630" y="230" class="pin">USB-C</text>
  <text x="728" y="300" class="mt">ESP32-S3 CAM</text>
  <text x="728" y="320" class="ms">AM312, DFPlayer nối</text>
  <text x="728" y="336" class="ms">như sơ đồ cũ</text>
  <text x="828" y="185" class="pin" text-anchor="end">5V</text>
  <text x="828" y="380" class="pin" text-anchor="end">GPIO48</text>
  <text x="780" y="430" class="pin" text-anchor="middle">GND</text>

  <!-- PHUN SƯƠNG -->
  <rect x="945" y="110" width="200" height="90" rx="10" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
  <text x="1045" y="150" class="wt" style="font-size:13px">MẠCH XANH PHUN SƯƠNG</text>
  <text x="1045" y="170" class="wt" style="font-size:12px">(Type-C)</text>
  <path d="M1145 155C1158 155 1160 165 1168 165" fill="none" stroke="#616161" stroke-width="2"/>
  <circle cx="1185" cy="165" r="16" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2"/>
  <rect x="1035" y="200" width="20" height="20" rx="6" fill="#455a64"/>
  <path d="M1045 220V245" class="cable"/>
  <text x="1112" y="240" class="ms">cáp Type-C đã cắt</text>

  <!-- dây đỏ: 5V ESP32 → dây đỏ cáp -->
  <path d="M838 180H900V265H1030L1040 250" class="w red"/>
  <text x="960" y="285" class="pin" style="fill:#d32f2f" text-anchor="middle">dây ĐỎ</text>
  <!-- dây đen: cáp → C -->
  <path d="M1050 250L1065 265V330" class="w blk"/>
  <text x="1080" y="300" class="pin">dây ĐEN</text>

  <!-- 2N2222 -->
  <rect x="1020" y="330" width="90" height="90" rx="10" fill="#fff8e1" stroke="#b7791f" stroke-width="2.5"/>
  <text x="1065" y="348" class="pin" text-anchor="middle">C</text>
  <text x="1030" y="380" class="pin">B</text>
  <text x="1065" y="414" class="pin" text-anchor="middle">E</text>
  <text x="1072" y="381" class="mt" style="font-size:13px">2N2222</text>

  <!-- GPIO48 → 150Ω → B -->
  <path d="M838 375H870" class="w ctl"/>
  <rect x="870" y="365" width="56" height="20" rx="4" class="res"/>
  <text x="898" y="358" class="pin" text-anchor="middle">150Ω</text>
  <path d="M926 375H1020" class="w ctl"/>
  <circle cx="965" cy="375" r="6" fill="#c2185b"/>
  <path d="M965 375V395" class="w ctl"/>
  <rect x="955" y="395" width="20" height="50" rx="4" class="res"/>
  <text x="983" y="425" class="pin">10kΩ</text>
  <path d="M965 445V480" class="w blk"/>

  <!-- GND -->
  <path d="M780 440V480H1065V420" class="w blk"/>
  <circle cx="965" cy="480" r="6" fill="#212121"/>

  <!-- Chân 2N2222 thật -->
  <text x="355" y="430" class="mt" style="font-size:13px">2N2222 (vỏ nhựa) nhìn từ mặt phẳng có chữ</text>
  <path d="M315 450H395V510Q355 530 315 510Z" fill="#263238"/>
  <text x="355" y="485" class="wt" style="font-size:11px">2N2222</text>
  <path d="M330 515V575M355 520V575M380 515V575" stroke="#90a4ae" stroke-width="5" stroke-linecap="round"/>
  <text x="330" y="595" class="pin" text-anchor="middle">E</text>
  <text x="355" y="595" class="pin" text-anchor="middle">B</text>
  <text x="380" y="595" class="pin" text-anchor="middle">C</text>
  <text x="355" y="612" class="ms">trái · giữa · phải (kiểm tra lại chữ trên chân/tài liệu)</text>

  <g class="badge">
    <circle cx="160" cy="115" r="14"/><text x="160" y="120">1</text>
    <circle cx="160" cy="375" r="14"/><text x="160" y="380">2</text>
    <circle cx="870" cy="180" r="14"/><text x="870" y="185">3</text>
    <circle cx="1065" cy="310" r="14"/><text x="1065" y="315">4</text>
    <circle cx="1065" cy="455" r="14"/><text x="1065" y="460">5</text>
    <circle cx="995" cy="375" r="14"/><text x="995" y="380">6</text>
    <circle cx="1000" cy="420" r="14"/><text x="1000" y="425">7</text>
  </g>

  <line x1="40" y1="640" x2="1200" y2="640" stroke="#d9e2ec" stroke-width="1.5"/>
  <g class="row">
    <text x="40" y="668"><tspan font-weight="800">1.</tspan> Pin (+) → B+ của mạch sạc</text>
    <text x="40" y="694"><tspan font-weight="800">2.</tspan> Pin (−) → B− của mạch sạc</text>
    <text x="40" y="720"><tspan font-weight="800">3.</tspan> Chân 5V ESP32 → dây ĐỎ của cáp (đầu Type-C cắm vào mạch xanh)</text>
    <text x="40" y="746"><tspan font-weight="800">4.</tspan> Dây ĐEN của cáp (đầu Type-C cắm vào mạch xanh) → chân C 2N2222</text>
    <text x="620" y="668"><tspan font-weight="800">5.</tspan> Chân E (trái) 2N2222 → chân GND của ESP32</text>
    <text x="620" y="694"><tspan font-weight="800">6.</tspan> GPIO48 → điện trở 150Ω → chân B (giữa) 2N2222</text>
    <text x="620" y="720"><tspan font-weight="800">7.</tspan> Điện trở 10kΩ: một đầu chân B, đầu kia GND</text>
    <text x="620" y="746">Cáp USB → Type-C: cổng USB mạch sạc → cổng USB-C ESP32</text><text x="620" y="628" class="pin">8. Đầu Type-C của cáp đã cắt → cắm vào cổng Type-C của MẠCH XANH phun sương</text>
  </g>
  <text x="40" y="784" class="warn">⚠ 2N2222 chịu tối đa khoảng 0,6A; phun sương dùng khoảng 0,3–0,4A nên dùng được (transistor hơi ấm là bình thường). Sương yếu → đổi 150Ω thành 100Ω.</text>
  <text x="40" y="806" class="warn">⚠ Nạp code: rút cáp mạch sạc, cắm cáp máy tính vào cùng cổng USB-C. Để âm lượng loa khoảng 20–22 để ESP32 không bị reset.</text>
</svg>
