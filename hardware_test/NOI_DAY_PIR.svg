<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760">
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #1f2933; }
    .title { font-size: 24px; font-weight: 700; }
    .sub   { font-size: 14px; fill: #52606d; }
    .mt    { font-size: 15px; font-weight: 700; text-anchor: middle; }
    .ms    { font-size: 12px; fill: #52606d; text-anchor: middle; }
    .pin   { font-size: 14px; font-weight: 700; fill: #334e68; }
    .pinw  { font-size: 14px; font-weight: 800; fill: #ffffff; }
    .row   { font-size: 15px; }
    .warn  { font-size: 13.5px; font-weight: 700; fill: #c62828; }
    .w     { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .red { stroke: #d32f2f; } .blk { stroke: #212121; } .yel { stroke: #f9a825; }
    .badge circle { fill: #ffffff; stroke: #1f2933; stroke-width: 2; }
    .badge text { font-size: 13px; font-weight: 800; text-anchor: middle; }
  </style>

  <rect width="1240" height="760" fill="#ffffff"/>
  <text x="40" y="46" class="title">NỐI CẢM BIẾN CHUYỂN ĐỘNG PIR AM312 MINI VÀO ESP32-S3 CAM</text>
  <text x="40" y="72" class="sub">Chỉ 3 dây, không cần điện trở hay tụ. Code đã dùng sẵn chân GPIO14.</text>

  <!-- ESP32 -->
  <rect x="60" y="120" width="300" height="320" rx="14" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="200" y="385" class="mt" style="font-size:18px">ESP32-S3 CAM</text>
  <text x="200" y="407" class="ms">OLED, DFPlayer, phun sương</text>
  <text x="200" y="423" class="ms">giữ nguyên như sơ đồ cũ</text>
  <text x="345" y="185" class="pin" text-anchor="end">3V3</text>
  <text x="345" y="245" class="pin" text-anchor="end">GPIO14</text>
  <text x="345" y="305" class="pin" text-anchor="end">GND</text>
  <circle cx="360" cy="180" r="7" fill="#ffca28" stroke="#b7791f" stroke-width="1.5"/>
  <circle cx="360" cy="240" r="7" fill="#ffca28" stroke="#b7791f" stroke-width="1.5"/>
  <circle cx="360" cy="300" r="7" fill="#ffca28" stroke="#b7791f" stroke-width="1.5"/>

  <!-- AM312: mạch nhỏ, 3 chân bên trái, mắt cảm biến bên phải -->
  <rect x="780" y="140" width="150" height="190" rx="12" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
  <circle cx="790" cy="180" r="9" fill="#ffca28"/><text x="808" y="185" class="pinw">VCC</text>
  <circle cx="790" cy="240" r="9" fill="#ffca28"/><text x="808" y="245" class="pinw">OUT</text>
  <circle cx="790" cy="300" r="9" fill="#ffca28"/><text x="808" y="305" class="pinw">GND</text>
  <circle cx="985" cy="235" r="55" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="2"/>
  <path d="M945 215h80M940 235h90M945 255h80M965 195v80M985 182v106M1005 195v80" stroke="#e0e0e0" stroke-width="1.5"/>
  <rect x="930" y="215" width="12" height="40" fill="#9e9e9e"/>
  <text x="880" y="355" class="mt">AM312 mini</text>
  <text x="880" y="373" class="ms">chân GIỮA luôn là OUT</text>

  <!-- dây -->
  <path d="M367 180H781" class="w red"/>
  <path d="M367 240H781" class="w yel"/>
  <path d="M367 300H781" class="w blk"/>
  <text x="560" y="170" class="pin" style="fill:#d32f2f" text-anchor="middle">dây ĐỎ</text>
  <text x="560" y="230" class="pin" style="fill:#b7791f" text-anchor="middle">dây VÀNG (tín hiệu)</text>
  <text x="560" y="290" class="pin" text-anchor="middle">dây ĐEN</text>
  <text x="560" y="335" class="ms">dài 15–30cm, để cảm biến cách anten ESP32 ≥ 10cm</text>

  <g class="badge">
    <circle cx="420" cy="180" r="14"/><text x="420" y="185">1</text>
    <circle cx="420" cy="240" r="14"/><text x="420" y="245">2</text>
    <circle cx="420" cy="300" r="14"/><text x="420" y="305">3</text>
  </g>

  <!-- Hình nhỏ: chân thật của AM312 -->
  <text x="880" y="430" class="mt" style="font-size:14px">Chân thật của AM312 (nhìn từ phía chân)</text>
  <rect x="780" y="445" width="200" height="110" rx="10" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
  <circle cx="830" cy="555" r="7" fill="#ffca28"/>
  <circle cx="880" cy="555" r="7" fill="#ffca28"/>
  <circle cx="930" cy="555" r="7" fill="#ffca28"/>
  <path d="M830 555V620M880 555V620M930 555V620" stroke="#90a4ae" stroke-width="5" stroke-linecap="round"/>
  <text x="830" y="640" class="pin" text-anchor="middle">VCC</text>
  <text x="880" y="640" class="pin" text-anchor="middle">OUT</text>
  <text x="930" y="640" class="pin" text-anchor="middle">GND</text>
  <text x="1000" y="585" class="ms" style="text-anchor:start">thứ tự VCC / GND có thể đảo</text>
  <text x="1000" y="603" class="ms" style="text-anchor:start">→ đọc chữ in trên mạch</text>

  <line x1="40" y1="672" x2="1200" y2="672" stroke="#d9e2ec" stroke-width="1.5"/>
  <g class="row">
    <text x="40" y="698"><tspan font-weight="800">1.</tspan> 3V3 ESP32 → VCC</text>
    <text x="360" y="698"><tspan font-weight="800">2.</tspan> GPIO14 → OUT (chân giữa)</text>
    <text x="760" y="698"><tspan font-weight="800">3.</tspan> GND ESP32 → GND</text>
  </g>
  <text x="40" y="728" class="warn">⚠ Xem chữ in trên mạch để biết chân VCC / GND. Chỉ cấp 3V3, KHÔNG cấp 5V. Nối ngược VCC–GND sẽ hỏng cảm biến.</text>
  <text x="40" y="750" class="warn">⚠ Cấp điện xong chờ 30–60 giây cảm biến mới ổn định. Báo chuyển động liên tục → để xa anten ESP32 hơn, xoắn 3 dây lại.</text>
</svg>
