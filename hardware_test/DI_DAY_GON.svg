<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800">
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #1f2933; }
    .title { font-size: 24px; font-weight: 700; }
    .sub   { font-size: 14px; fill: #52606d; }
    .mt    { font-size: 15px; font-weight: 700; text-anchor: middle; }
    .ms    { font-size: 12px; fill: #52606d; text-anchor: middle; }
    .wt    { font-size: 14px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .pinw  { font-size: 13px; font-weight: 700; fill: #ffe082; }
    .pin   { font-size: 13px; font-weight: 700; fill: #334e68; }
    .row   { font-size: 14px; }
    .warn  { font-size: 13.5px; font-weight: 700; fill: #c62828; }
    .w     { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .red { stroke: #d32f2f; } .blk { stroke: #212121; } .ctl { stroke: #c2185b; }
    .cable { fill: none; stroke: #9e9e9e; stroke-width: 10; stroke-linecap: round; }
    .term  { fill: #43a047; stroke: #1b5e20; stroke-width: 1.5; }
    .badge circle { fill: #ffffff; stroke: #1f2933; stroke-width: 2; }
    .badge text { font-size: 13px; font-weight: 800; text-anchor: middle; }
  </style>

  <rect width="1240" height="800" fill="#ffffff"/>
  <text x="40" y="46" class="title">CÁCH ĐI DÂY GỌN NHẤT – chỉ 7 dây, không cần điện trở</text>
  <text x="40" y="72" class="sub">Pin → mạch sạc → cáp USB cắm thẳng vào ESP32. Phun sương bật/tắt bằng MODULE MOSFET có cọc vít (D4184 / "module MOSFET kích 3,3V").</text>

  <!-- PIN -->
  <rect x="75" y="135" width="40" height="15" rx="3" fill="#90a4ae"/>
  <rect x="40" y="150" width="110" height="200" rx="16" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="95" y="178" class="mt" style="fill:#d32f2f;font-size:22px">+</text>
  <text x="95" y="242" class="mt">PIN</text>
  <text x="95" y="262" class="mt">3,7V</text>
  <text x="95" y="282" class="ms">10000mAh</text>
  <text x="95" y="338" class="mt" style="font-size:24px">−</text>
  <path d="M95 135V115H215V190H252" class="w red"/>
  <path d="M95 350V375H215V290H252" class="w blk"/>

  <!-- MẠCH SẠC -->
  <rect x="250" y="150" width="210" height="180" rx="10" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
  <text x="355" y="235" class="wt">MẠCH SẠC</text>
  <text x="355" y="255" class="wt">5V 2A</text>
  <circle cx="262" cy="190" r="7" fill="#ffca28"/><text x="276" y="195" class="pinw">B+</text>
  <circle cx="262" cy="290" r="7" fill="#ffca28"/><text x="276" y="295" class="pinw">B−</text>
  <rect x="450" y="212" width="34" height="56" rx="4" fill="#cfd8dc" stroke="#607d8b" stroke-width="2"/>
  <rect x="458" y="222" width="18" height="36" fill="#37474f"/>
  <rect x="330" y="322" width="50" height="16" rx="4" fill="#9e9e9e"/>
  <text x="355" y="360" class="ms">↑ cắm sạc điện thoại để sạc pin</text>

  <!-- CÁP USB → ESP32 -->
  <path d="M484 240H596" class="cable"/>
  <rect x="596" y="230" width="22" height="20" rx="6" fill="#455a64"/>
  <text x="540" y="206" class="pin" text-anchor="middle">cáp USB → Type-C</text>
  <text x="540" y="270" class="ms">cắm, không cần hàn</text>

  <!-- ESP32 -->
  <rect x="618" y="140" width="220" height="300" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="630" y="230" class="pin">USB-C</text>
  <text x="728" y="330" class="mt">ESP32-S3 CAM</text>
  <text x="728" y="350" class="ms">AM312, DFPlayer nối</text>
  <text x="728" y="366" class="ms">như sơ đồ cũ</text>
  <text x="828" y="185" class="pin" text-anchor="end">5V</text>
  <text x="828" y="225" class="pin" text-anchor="end">GND</text>
  <text x="828" y="285" class="pin" text-anchor="end">GPIO48</text>

  <!-- MODULE MOSFET -->
  <rect x="940" y="140" width="200" height="200" rx="10" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
  <text x="1045" y="235" class="wt">MODULE</text>
  <text x="1045" y="255" class="wt">MOSFET</text>
  <text x="1045" y="273" class="wt" style="font-size:12px">(D4184)</text>
  <rect x="932" y="168" width="18" height="34" rx="3" class="term"/>
  <rect x="932" y="208" width="18" height="34" rx="3" class="term"/>
  <rect x="932" y="268" width="18" height="34" rx="3" class="term"/>
  <text x="958" y="185" class="pinw">VIN+</text>
  <text x="958" y="230" class="pinw">VIN−</text>
  <text x="958" y="290" class="pinw">TRIG</text>
  <rect x="990" y="332" width="34" height="18" rx="3" class="term"/>
  <rect x="1060" y="332" width="34" height="18" rx="3" class="term"/>
  <text x="1007" y="322" class="pinw" text-anchor="middle">OUT+</text>
  <text x="1077" y="322" class="pinw" text-anchor="middle">OUT−</text>

  <path d="M838 180H932" class="w red"/>
  <path d="M838 220H932" class="w blk"/>
  <path d="M838 280H932" class="w ctl"/>

  <!-- PHUN SƯƠNG -->
  <path d="M1007 350V420L1030 445" class="w red"/>
  <path d="M1077 350V420L1054 445" class="w blk"/>
  <path d="M1042 445V478" class="cable"/>
  <rect x="1032" y="478" width="20" height="22" rx="6" fill="#455a64"/>
  <text x="995" y="402" class="pin" style="fill:#d32f2f" text-anchor="end">dây ĐỎ</text>
  <text x="1089" y="402" class="pin">dây ĐEN</text>
  <text x="1105" y="465" class="ms">cáp Type-C đã cắt</text>
  <rect x="957" y="500" width="170" height="90" rx="10" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
  <text x="1042" y="540" class="wt" style="font-size:13px">MẠCH PHUN SƯƠNG</text>
  <text x="1042" y="560" class="wt" style="font-size:12px">(Type-C)</text>
  <path d="M1127 545C1150 545 1155 555 1165 555" fill="none" stroke="#616161" stroke-width="2"/>
  <circle cx="1182" cy="555" r="16" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2"/>

  <g class="badge">
    <circle cx="160" cy="115" r="14"/><text x="160" y="120">1</text>
    <circle cx="160" cy="375" r="14"/><text x="160" y="380">2</text>
    <circle cx="885" cy="180" r="14"/><text x="885" y="185">3</text>
    <circle cx="885" cy="220" r="14"/><text x="885" y="225">4</text>
    <circle cx="885" cy="280" r="14"/><text x="885" y="285">5</text>
    <circle cx="1007" cy="380" r="14"/><text x="1007" y="385">6</text>
    <circle cx="1077" cy="380" r="14"/><text x="1077" y="385">7</text>
  </g>

  <line x1="40" y1="620" x2="1200" y2="620" stroke="#d9e2ec" stroke-width="1.5"/>
  <g class="row">
    <text x="40" y="650"><tspan font-weight="800">1.</tspan> Pin (+) → B+ của mạch sạc</text>
    <text x="40" y="676"><tspan font-weight="800">2.</tspan> Pin (−) → B− của mạch sạc</text>
    <text x="40" y="702"><tspan font-weight="800">3.</tspan> Chân 5V của ESP32 → VIN+ của module MOSFET</text>
    <text x="40" y="728"><tspan font-weight="800">4.</tspan> Chân GND của ESP32 → VIN− của module MOSFET</text>
    <text x="620" y="650"><tspan font-weight="800">5.</tspan> GPIO48 của ESP32 → TRIG (hoặc PWM / SIG) của module</text>
    <text x="620" y="676"><tspan font-weight="800">6.</tspan> OUT+ của module → dây ĐỎ cáp Type-C phun sương</text>
    <text x="620" y="702"><tspan font-weight="800">7.</tspan> OUT− của module → dây ĐEN cáp Type-C phun sương</text>
    <text x="620" y="728">Cáp USB → Type-C: cổng USB mạch sạc → cổng USB-C ESP32</text>
  </g>
  <text x="40" y="764" class="warn">⚠ Nạp code: rút cáp từ mạch sạc ra, cắm cáp máy tính vào cùng cổng USB-C – không bao giờ bị cấp 2 nguồn cùng lúc.</text>
  <text x="40" y="786" class="warn">⚠ Mọi thiết bị lấy điện qua cổng USB của ESP32: để âm lượng loa khoảng 20–22 để tránh ESP32 bị reset.</text>
</svg>
